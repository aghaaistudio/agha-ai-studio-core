<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error — Agha AI Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-base: #0d0206; --bg-panel: rgba(30, 10, 18, 0.6); --accent-pink: #ff3366; --text-main: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .glass-panel { background: var(--bg-panel); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; padding: 50px; text-align: center; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); }
        h1 { font-size: 80px; color: var(--accent-pink); margin-bottom: 10px; }
        h2 { font-size: 24px; margin-bottom: 20px; }
        p { color: #b09ea1; margin-bottom: 30px; }
        .btn { background: var(--accent-pink); color: white; padding: 12px 24px; border-radius: 10px; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="glass-panel">
        <h1>500</h1>
        <h2>Internal Server Error</h2>
        <p>Something went wrong on our end. Our team has been notified.</p>
        <a href="{{ url_for('main.home') }}" class="btn">Return to Workspace</a>
    </div>
</body>
</html>
