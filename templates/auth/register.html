<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Agha AI Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0d0206;
            --bg-panel: rgba(30, 10, 18, 0.6);
            --border-color: rgba(255, 51, 102, 0.2);
            --accent-pink: #ff3366;
            --accent-gold: #ffb703;
            --text-main: #ffffff;
            --text-muted: #b09ea1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        
        .orb { position: fixed; border-radius: 50%; filter: blur(100px); z-index: 0; opacity: 0.5; animation: float 10s infinite alternate; }
        .orb-1 { top: -10%; left: -10%; width: 500px; height: 500px; background: #ff3366; }
        .orb-2 { bottom: -10%; right: -10%; width: 400px; height: 400px; background: #800020; }
        @keyframes float { 0% { transform: translateY(0px) scale(1); } 100% { transform: translateY(30px) scale(1.1); } }

        .auth-container { width: 100%; max-width: 450px; padding: 20px; position: relative; z-index: 10; }
        
        .glass-panel { background: var(--bg-panel); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.08); border-top: 1px solid rgba(255, 255, 255, 0.2); border-radius: 24px; padding: 40px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); }
        
        .brand-logo { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; line-height: 1; }
        .logo-agha { font-size: 36px; font-weight: 900; letter-spacing: 2px; background: linear-gradient(180deg, #ff9d00 0%, #d35400 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 2px 2px 5px rgba(0,0,0,0.8); font-family: 'Impact', 'Arial Black', sans-serif; }
        .logo-sub { font-size: 12px; font-weight: 700; letter-spacing: 7px; background: linear-gradient(180deg, #ffffff 0%, #b3b3b3 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 1px 1px 3px rgba(0,0,0,0.9); margin-top: 3px; margin-left: 7px; }

        h2 { text-align: center; font-weight: 600; font-size: 20px; margin-bottom: 25px; color: #fff; }

        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 13px; }
        input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 14px 18px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: white; font-size: 15px; transition: 0.3s; }
        input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus { outline: none; border-color: var(--accent-pink); box-shadow: 0 0 15px rgba(255, 51, 102, 0.3); }

        .btn { background: linear-gradient(135deg, var(--accent-pink) 0%, #d90429 100%); color: white; border: none; padding: 16px; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 16px; transition: all 0.3s ease; box-shadow: 0 8px 20px rgba(255, 51, 102, 0.3); text-transform: uppercase; width: 100%; margin-top: 10px; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(255, 51, 102, 0.5); }

        .auth-links { text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-muted); }
        .auth-links a { color: var(--accent-gold); text-decoration: none; font-weight: 600; }
        .auth-links a:hover { text-decoration: underline; }

        .flash { padding: 12px; border-radius: 10px; margin-bottom: 20px; font-weight: 500; font-size: 14px; text-align: center; }
        .flash-success { background: rgba(76, 175, 80, 0.15); color: #a5d6a7; border: 1px solid rgba(76, 175, 80, 0.4); }
        .flash-error { background: rgba(244, 67, 54, 0.15); color: #ef9a9a; border: 1px solid rgba(244, 67, 54, 0.4); }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="auth-container">
        <div class="glass-panel">
            <div class="brand-logo">
                <div class="logo-agha">AGHA</div>
                <div class="logo-sub">AI STUDIO</div>
            </div>

            <h2>Create Your Account</h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash flash-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.register') }}">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required maxlength="120" placeholder="Enter your full name">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required maxlength="255" placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="password">Password (min 8 characters)</label>
                    <input type="password" id="password" name="password" required minlength="8" placeholder="Create a password">
                </div>
                <div class="form-group">
                    <label for="password_confirm">Confirm Password</label>
                    <input type="password" id="password_confirm" name="password_confirm" required minlength="8" placeholder="Confirm your password">
                </div>
                <button type="submit" class="btn">Sign Up</button>
            </form>

            <div class="auth-links">
                Already have an account? <a href="{{ url_for('auth.login') }}">Log in here</a>
            </div>
        </div>
    </div>
</body>
</html>
